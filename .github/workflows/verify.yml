name: Verify

on:
  push:
    branches:
      - main
      - feat/user-team-sharing
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agentbox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/agentbox_test?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dashboard dependencies
        run: bun install --frozen-lockfile

      - name: Verify ChatGPT file attachment contract
        run: bun run verify:chatgpt-files

      - name: Verify MCP attachment access
        run: bun run verify:mcp-attachments

      - name: Run final user/team cutover verification
        run: bun run verify:cutover

  raycast:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: raycast/agentbox/package-lock.json

      - name: Install Raycast extension dependencies
        working-directory: raycast/agentbox
        run: npm ci

      - name: Verify Raycast extension
        working-directory: raycast/agentbox
        env:
          CI: "1"
          NO_COLOR: "1"
        run: npm run verify

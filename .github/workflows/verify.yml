name: Verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agentbox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/agentbox_test?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify Go
        run: make check-go-full

  windows-cli:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run Windows-native CLI tests
        shell: pwsh
        run: |
          go test ./cmd/agentbox ./internal/agentbox/cli ./internal/agentbox/profiles
          cd packaging/cli
          npm test
          cd ../..

      - name: Build and install the packed npm CLI
        shell: pwsh
        run: |
          node ./packaging/cli/prepare.mjs
          $packDir = Join-Path $env:RUNNER_TEMP "agentbox-pack"
          New-Item -ItemType Directory -Force -Path $packDir | Out-Null
          npm pack ./packaging/cli --pack-destination $packDir
          $package = Get-ChildItem $packDir -Filter "amxv-agentbox-*.tgz" | Select-Object -First 1
          if (-not $package) { throw "Packed Agentbox npm tarball not found." }
          npm install --global $package.FullName
          $expected = node -p "require('./packaging/cli/package.json').version"
          $actual = (agentbox --version).Trim()
          if ($actual -ne $expected) { throw "agentbox --version returned $actual; expected $expected" }
          $globalRoot = (npm root --global).Trim()
          $installedRoot = Join-Path $globalRoot "@amxv\agentbox"
          if (-not (Test-Path (Join-Path $installedRoot "vendor\windows-amd64\agentbox.exe"))) { throw "Native Windows payload was pruned unexpectedly." }
          if (Test-Path (Join-Path $installedRoot "vendor\linux-amd64")) { throw "Non-Windows payload was not pruned after install." }
          $env:AGENTBOX_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "agentbox-config"
          agentbox profiles add smoke --base-url https://agentbox.example --api-key agb_windows_smoke --activate
          $profiles = agentbox profiles --json | ConvertFrom-Json
          if ($profiles.active_profile -ne "smoke") { throw "Windows profile persistence failed." }
          if (-not (Test-Path (Join-Path $env:AGENTBOX_CONFIG_DIR "profiles.json"))) { throw "Windows profile file was not created." }

      - name: Verify Windows ARM64 cross-build
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "arm64"
          go build -trimpath -ldflags "-s -w" -o "$env:RUNNER_TEMP\agentbox-arm64.exe" ./cmd/agentbox
          if (-not (Test-Path "$env:RUNNER_TEMP\agentbox-arm64.exe")) { throw "Windows ARM64 binary was not produced." }

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dashboard dependencies
        run: make setup-dashboard

      - name: Verify dashboard
        run: make check-dashboard

      - name: Verify dashboard/backend integration
        run: make check-integration

      - name: Check patch hygiene
        run: make check-hygiene

  raycast:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/raycast/package-lock.json

      - name: Install Raycast extension dependencies
        working-directory: apps/raycast
        run: npm ci

      - name: Verify Raycast extension
        run: make check-raycast
